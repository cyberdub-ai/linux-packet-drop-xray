[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-packet-drop-xray"
version = "0.1.0"
description = "Zero-dependency 5-layer Linux network packet drop analyzer (ethtool, softnet_stat, tc, ss/nstat, eBPF kfree_skb)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Alexey Zhuykov", email = "alexey.zhuykov@gmail.com" }]
keywords = ["linux-networking", "ebpf", "bpftrace", "sre", "ethtool", "packet-loss", "observability", "netops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
packet-drop-xray = "packet_drop_xray.__main__:main"

[project.urls]
Homepage = "https://github.com/cyberdub-ai/linux-packet-drop-xray"
Repository = "https://github.com/cyberdub-ai/linux-packet-drop-xray"
Author = "https://cyberdub.su"
